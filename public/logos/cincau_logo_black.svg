        <path d="M 22 30 C 22 16, 34 8, 56 8 C 78 8, 90 16, 90 30 L 98 62 C 101 70, 92 78, 80 78 L 32 78 C 20 78, 11 70, 14 62 Z" fill="#0f172a" />
        
        <!-- White Cutout Features -->
        <ellipse cx="56" cy="18" rx="22" ry="6" fill="#ffffff" />
        <!-- Eyes Cutout -->
        <circle cx="42" cy="45" r="5.5" fill="#ffffff" />
        <circle cx="42" cy="45" r="2" fill="#0f172a" />
        <circle cx="70" cy="45" r="5.5" fill="#ffffff" />
        <circle cx="70" cy="45" r="2" fill="#0f172a" />
        <!-- Smiling Mouth Cutout -->
        <path d="M 50 52 Q 56 61 62 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

