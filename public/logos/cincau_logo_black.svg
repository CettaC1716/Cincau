      <circle cx="232" cy="110" r="18" />
      <rect x="214" y="142" width="36" height="128" rx="18" />
    </g>

    <!-- ================= LETTER n ================= -->
    <path d="M 272 142 C 262 142 254 150 254 160 L 254 252 C 254 262 284 262 284 252 L 284 200 C 284 176 298 164 318 164 C 338 164 348 176 348 200 L 348 252 C 348 262 378 262 378 252 L 378 194 C 378 158 354 142 320 142 C 300 142 288 152 280 162 L 280 160 C 280 150 272 142 272 142 Z" />

    <!-- ================= LETTER c ================= -->
    <path d="M 430 142 C 390 142 360 172 360 210 C 360 248 390 270 430 270 C 458 270 476 256 484 238 C 487 231 477 226 470 230 C 460 235 448 242 430 242 C 408 242 390 228 390 210 C 390 192 408 170 430 170 C 448 170 460 176 470 181 C 477 185 487 180 484 173 C 476 155 458 142 430 142 Z" />

    <!-- ================= LETTER a ================= -->
    <path d="M 540 142 C 504 142 478 168 478 206 C 478 244 504 270 540 270 C 556 270 570 262 578 250 L 578 252 C 578 262 604 262 604 252 L 604 160 C 604 150 580 142 540 142 Z M 540 172 C 560 172 574 186 574 206 C 574 226 560 240 540 240 C 520 240 508 226 508 206 C 508 186 520 172 540 172 Z" />

    <!-- ================= LETTER u WITH CUTE JELLY MASCOT ================= -->
    <g>
      <path d="M 618 160 C 618 150 644 150 644 160 L 644 215 C 644 228 656 238 672 238 C 688 238 700 228 700 215 L 700 160 C 700 150 726 150 726 160 L 726 242 C 726 262 698 270 672 270 C 642 270 618 252 618 228 Z" />

      <!-- CUTE JELLY FLAN / PUDDING MASCOT RIDING ON TOP RIGHT OF 'u' -->
