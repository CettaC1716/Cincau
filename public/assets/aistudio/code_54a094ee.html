<!DOCTYPE html><html class="h-full" lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Bento Cards - Kurikulum Merdeka</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
</script>
<style>
  /* Entrance Animations */
  @keyframes entranceFadeUp {
    0% {
      opacity: 0;
      transform: translateY(28px) scale(0.98);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card-enter-1 {
    animation: entranceFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
  }
  .card-enter-2 {
    animation: entranceFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
  }
  .card-enter-3 {
    animation: entranceFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
  }

  /* Micro-Motion keyframes */
  @keyframes floatDrift {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    50% {
      transform: translateY(-14px) rotate(10deg);
    }
  }

  /* Pulse button halo */
  @keyframes buttonPulseRing {
    0% {
      box-shadow: 0 0 0 0 rgba(163, 230, 53, 0.55);
    }
    70% {
      box-shadow: 0 0 0 14px rgba(163, 230, 53, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(163, 230, 53, 0);
    }
  }

  .btn-lime-pulse:hover {
    animation: buttonPulseRing 1.8s infinite cubic-bezier(0.24, 0, 0.38, 1);
  }

  /* Ripple click effect */
  .ripple-circle {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: rippleWave 0.6s ease-out;
    background-color: rgba(255, 255, 255, 0.45);
    pointer-events: none;
  }

  @keyframes rippleWave {
    to {
      transform: scale(3.5);
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<svg class="w-5 h-5 fill-current ml-0.5 group-hover/btn:scale-110 group-hover/btn:rotate-12 transition-transform duration-300" viewBox="0 0 24 24">

<div class="absolute right-0 bottom-0 top-0 w-[270px] sm:w-[300px] pointer-events-none overflow-hidden flex items-end justify-end rounded-r-[32px]">

<!-- CARD 3 (Bottom Right: Menggambar - IMAGE_27) -->

<svg class="w-5 h-5 fill-current ml-0.5 group-hover/btn:scale-110 group-hover/btn:rotate-12 transition-transform duration-300" viewBox="0 0 24 24">

</main>
<script>
  // Ripple effect on tactile action button clicks
  const buttons = document.querySelectorAll('.interactive-btn');
  buttons.forEach((btn) => {
    btn.addEventListener('click', function (e) {
      const circle = document.createElement('span');
      circle.classList.add('ripple-circle');
      
      const diameter = Math.max(this.clientWidth, this.clientHeight);
      const radius = diameter / 2;
      const rect = this.getBoundingClientRect();

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;

      const existingRipple = this.querySelector('.ripple-circle');
      if (existingRipple) {
        existingRipple.remove();
      }

      this.appendChild(circle);
      setTimeout(() => circle.remove(), 600);
    });
  });
</script>
</body></html>
